<div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
  <h3 class="text-lg font-semibold text-text">{{ name or value }}</h3>
  {% if name %}<span class="text-xs text-subtle">{{ value }}</span>{% endif %}
  {% if n is not none %}<span class="text-sm text-subtle" id="res-label">{{ n }} points</span>{% endif %}
  <form class="flex items-center gap-1 ml-auto" hx-post="/interval/name" hx-target="#interval-header" hx-swap="innerHTML">
    <input type="hidden" name="tag" value="{{ tag }}"><input type="hidden" name="value" value="{{ value }}"><input type="hidden" name="n" value="{{ n if n is not none else '' }}">
    <input type="text" name="name" value="{{ name }}" placeholder="name this interval" maxlength="80"
           class="rounded bg-base text-text border border-border px-2 py-0.5 text-sm w-56 focus:outline-none focus:border-accent">
    <button type="submit" class="text-xs px-2 py-1 rounded border border-border text-subtle hover:text-accent hover:border-accent">save</button>
  </form>
</div>
