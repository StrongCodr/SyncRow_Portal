<div class="flex gap-1 border-b border-border text-sm">
  <button class="px-3 py-1.5 rounded-t border border-b-0 {% if active_tab == 'dashboard' %}border-border bg-surface text-text{% else %}border-transparent text-subtle hover:text-accent{% endif %}"
          hx-get="/interval?tag={{ tag|urlencode }}&value={{ value|urlencode }}" hx-target="#content">Dashboard</button>
  <button class="px-3 py-1.5 rounded-t border border-b-0 {% if active_tab == 'replay' %}border-border bg-surface text-text{% else %}border-transparent text-subtle hover:text-accent{% endif %}"
          hx-get="/interval/replay_view?tag={{ tag|urlencode }}&value={{ value|urlencode }}" hx-target="#content">Replay</button>
</div>
